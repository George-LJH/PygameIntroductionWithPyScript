<!DOCTYPE html>
<html lang="en">
<head>
  <title>PyScript PyGame-CE Example</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <link rel="stylesheet" 
    href="https://pyscript.net/releases/2026.3.1/core.css">
  <script type="module" 
    src="https://pyscript.net/releases/2026.3.1/core.js"></script>
  <script src="https://unpkg.com/panic-overlay"></script>
  <script>alert("Executing in single file version\nThis will pull source code from the most recent commit at:\nhttps://github.com/George-LJH/PygameIntroductionWithPyScript")</script>
  <style>
    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #111;
    }

    #canvas {
      display: block;
      max-width: 100vw;
      max-height: 100vh;
      width: auto;
      height: auto;
      image-rendering: pixelated;
    }
  </style>
</head>
<body>
  <canvas id="canvas">
  </canvas>
  <script type="py-game" src="https://raw.githubusercontent.com/George-LJH/PygameIntroductionWithPyScript/refs/heads/main/main.py" 
    config="https://raw.githubusercontent.com/George-LJH/PygameIntroductionWithPyScript/refs/heads/main/pyscript.toml"></script>
</body>
</html>
